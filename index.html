<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>ZimVault - Support Zimbabwean Creators</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); }
        .content-blur { filter: blur(20px); transform: scale(1.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes pulse-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .loading { animation: pulse-glow 1.5s ease-in-out infinite; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans">
    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 glass border-b border-slate-700">
        <div class="flex justify-between items-center p-4 max-w-md mx-auto">
            <h1 class="text-xl font-bold text-emerald-400">ZimVault</h1>
            <div class="flex gap-4">
                <button onclick="showTab('feed')" id="nav-feed" class="text-emerald-400">Feed</button>
                <button onclick="showTab('wallet')" id="nav-wallet" class="text-slate-400">Wallet</button>
                <button onclick="showTab('profile')" id="nav-profile" class="text-slate-400">Profile</button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="pt-20 pb-20 max-w-md mx-auto px-4">
        
        <!-- FEED TAB -->
        <div id="tab-feed" class="space-y-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold">Discover Creators</h2>
                <select id="filter-category" onchange="loadFeed()" class="bg-slate-800 text-sm rounded p-1">
                    <option value="all">All</option>
                    <option value="art">Visual Art</option>
                    <option value="music">Music</option>
                    <option value="photography">Photography</option>
                </select>
            </div>
            
            <div id="feed-container" class="space-y-6">
                <!-- Dynamic Content Loaded Here -->
                <div class="text-center py-8 text-slate-500">Loading creators...</div>
            </div>
        </div>

        <!-- WALLET TAB -->
        <div id="tab-wallet" class="hidden space-y-6">
            <div class="glass rounded-2xl p-6 text-center">
                <p class="text-slate-400 text-sm mb-1">Available Balance</p>
                <h3 class="text-3xl font-bold text-emerald-400" id="wallet-balance">$0.00</h3>
                <p class="text-xs text-slate-500 mt-1" id="wallet-ecocash">EcoCash: Not linked</p>
            </div>

            <div class="glass rounded-2xl p-4">
                <h4 class="font-semibold mb-3">Withdraw Funds</h4>
                <input type="tel" id="withdraw-phone" placeholder="EcoCash Number (077...)" 
                       class="w-full bg-slate-800 rounded p-3 mb-3 text-white">
                <input type="number" id="withdraw-amount" placeholder="Amount (USD)" 
                       class="w-full bg-slate-800 rounded p-3 mb-3 text-white">
                <button onclick="requestWithdrawal()" 
                        class="w-full bg-emerald-600 hover:bg-emerald-500 rounded-lg py-3 font-semibold">
                    Withdraw to EcoCash
                </button>
                <p class="text-xs text-slate-500 mt-2">Processing time: 24 hours • Min: $5 • Fee: $0.50</p>
            </div>

            <div class="glass rounded-2xl p-4">
                <h4 class="font-semibold mb-3">Transaction History</h4>
                <div id="transaction-list" class="space-y-2 text-sm">
                    <p class="text-slate-500">No transactions yet</p>
                </div>
            </div>
        </div>

        <!-- PROFILE TAB -->
        <div id="tab-profile" class="hidden space-y-6">
            <div class="glass rounded-2xl p-6 text-center">
                <div class="w-24 h-24 bg-slate-700 rounded-full mx-auto mb-4 flex items-center justify-center text-2xl font-bold" id="profile-initial">?</div>
                <h3 id="profile-name" class="text-xl font-bold">Guest User</h3>
                <p id="profile-bio" class="text-slate-400 text-sm mt-1">Sign in to start earning</p>
            </div>

            <div id="creator-dashboard" class="hidden space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass rounded-xl p-4 text-center">
                        <p class="text-2xl font-bold text-emerald-400" id="stat-earnings">$0</p>
                        <p class="text-xs text-slate-400">Total Earnings</p>
                    </div>
                    <div class="glass rounded-xl p-4 text-center">
                        <p class="text-2xl font-bold text-blue-400" id="stat-content">0</p>
                        <p class="text-xs text-slate-400">Posts</p>
                    </div>
                </div>

                <button onclick="showUploadModal()" 
                        class="w-full bg-blue-600 hover:bg-blue-500 rounded-lg py-3 font-semibold">
                    + Upload New Content
                </button>
            </div>

            <div class="space-y-3">
                <button onclick="loginWithPhone()" 
                        class="w-full bg-slate-700 hover:bg-slate-600 rounded-lg py-3">
                    Sign in with Phone
                </button>
                <button onclick="becomeCreator()" 
                        class="w-full border border-emerald-500 text-emerald-400 rounded-lg py-3">
                    Become a Creator
                </button>
            </div>
        </div>
    </main>

    <!-- Content View Modal -->
    <div id="modal-content" class="fixed inset-0 z-50 hidden bg-black/95 flex-col items-center justify-center p-4">
        <button onclick="closeModal()" class="absolute top-4 right-4 text-white text-2xl">&times;</button>
        <div class="w-full max-w-md">
            <img id="modal-image" src="" class="w-full rounded-lg mb-4" style="filter: blur(0px);">
            <h3 id="modal-title" class="text-xl font-bold mb-2"></h3>
            <p id="modal-creator" class="text-emerald-400 text-sm mb-4"></p>
            <div class="flex gap-2 mb-4">
                <button onclick="purchaseContent()" class="flex-1 bg-emerald-600 rounded-lg py-3 font-bold" id="btn-purchase">
                    Unlock $5.00
                </button>
                <button onclick="tipCreator()" class="bg-slate-700 rounded-lg px-4 py-3">Tip $1</button>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="modal-upload" class="fixed inset-0 z-50 hidden bg-black/95 flex items-center justify-center p-4">
        <div class="glass rounded-2xl p-6 w-full max-w-md">
            <h3 class="text-lg font-bold mb-4">Upload Content</h3>
            <input type="file" id="upload-file" accept="image/*" class="w-full mb-3 text-sm">
            <input type="text" id="upload-title" placeholder="Title" class="w-full bg-slate-800 rounded p-3 mb-3">
            <input type="number" id="upload-price" placeholder="Price USD (e.g., 3)" class="w-full bg-slate-800 rounded p-3 mb-3">
            <select id="upload-category" class="w-full bg-slate-800 rounded p-3 mb-4">
                <option value="art">Visual Art</option>
                <option value="music">Music</option>
                <option value="photography">Photography</option>
            </select>
            <div class="flex gap-2">
                <button onclick="uploadContent()" class="flex-1 bg-blue-600 rounded-lg py-3">Publish</button>
                <button onclick="closeUploadModal()" class="flex-1 bg-slate-700 rounded-lg py-3">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Paynow Integration Stub -->
    <script>
        // CONFIGURATION - Replace with your actual keys
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const PAYNOW_INTEGRATION_ID = 'YOUR_PAYNOW_ID';
        const PAYNOW_INTEGRATION_KEY = 'YOUR_PAYNOW_KEY';
        const PLATFORM_FEE_PERCENT = 10;

        // Initialize Supabase (if configured)
        let supabase = null;
        if (SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
            supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // State Management
        let currentUser = null;
        let currentContent = null;
        let db = { creators: [], content: [], transactions: [] };

        // Initialize Demo Data (Remove in production)
        function initDemo() {
            db.creators = [
                { id: 1, name: "Tatenda Sculptures", bio: "Stone sculptor from Harare", category: "art", eco: "0771234567", earnings: 0 },
                { id: 2, name: "Bulawayo Beats", bio: "Afro-fusion producer", category: "music", eco: "0779876543", earnings: 0 }
            ];
            db.content = [
                { id: 1, creator_id: 1, title: "Shona Eagle", price: 5, category: "art", image: "https://picsum.photos/400/400?random=1", unlocked: false },
                { id: 2, creator_id: 2, title: "Ndebele Rhythm", price: 3, category: "music", image: "https://picsum.photos/400/400?random=2", unlocked: false }
            ];
            loadFeed();
        }

        // Navigation
        function showTab(tabName) {
            ['feed', 'wallet', 'profile'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.add('hidden');
                document.getElementById(`nav-${tab}`).classList.remove('text-emerald-400');
                document.getElementById(`nav-${tab}`).classList.add('text-slate-400');
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`nav-${tabName}`).classList.add('text-emerald-400');
            
            if (tabName === 'wallet') loadWallet();
        }

        // Feed Loading
        function loadFeed() {
            const container = document.getElementById('feed-container');
            const filter = document.getElementById('filter-category').value;
            
            let html = '';
            db.content.filter(c => filter === 'all' || c.category === filter).forEach(content => {
                const creator = db.creators.find(c => c.id === content.creator_id);
                html += `
                    <div class="glass rounded-2xl overflow-hidden" onclick="openContent(${content.id})">
                        <div class="relative h-64 bg-slate-800">
                            <img src="${content.image}" class="w-full h-full object-cover ${content.unlocked ? '' : 'content-blur'}">
                            ${!content.unlocked ? '<div class="absolute inset-0 flex items-center justify-center"><span class="bg-black/50 px-3 py-1 rounded-full text-sm">🔒 Locked</span></div>' : ''}
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold">${content.title}</h3>
                            <p class="text-sm text-emerald-400">@${creator.name}</p>
                            <div class="flex justify-between items-center mt-2">
                                <span class="text-lg font-bold text-white">$${content.price}</span>
                                <button class="text-sm bg-emerald-600 px-3 py-1 rounded-full">${content.unlocked ? 'View' : 'Unlock'}</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html || '<p class="text-center text-slate-500">No content found</p>';
        }

        // Content Interaction
        function openContent(id) {
            currentContent = db.content.find(c => c.id === id);
            const creator = db.creators.find(c => c.id === currentContent.creator_id);
            
            document.getElementById('modal-image').src = currentContent.image;
            document.getElementById('modal-image').style.filter = currentContent.unlocked ? 'none' : 'blur(20px)';
            document.getElementById('modal-title').textContent = currentContent.title;
            document.getElementById('modal-creator').textContent = `by ${creator.name}`;
            document.getElementById('btn-purchase').textContent = currentContent.unlocked ? 'Unlocked ✓' : `Unlock $${currentContent.price}`;
            document.getElementById('modal-content').classList.remove('hidden');
            document.getElementById('modal-content').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('modal-content').classList.add('hidden');
            document.getElementById('modal-content').classList.remove('flex');
        }

        // Payment Flow (Simulated - Replace with Paynow)
        function purchaseContent() {
            if (currentContent.unlocked) return;
            
            const phone = prompt("Enter your EcoCash number (077...):");
            if (!phone) return;
            
            // Simulate Paynow Transaction
            alert(`Initiating EcoCash payment of $${currentContent.price}...\n\nIn production, this opens Paynow popup.`);
            
            // Simulate success
            setTimeout(() => {
                currentContent.unlocked = true;
                const creator = db.creators.find(c => c.id === currentContent.creator_id);
                const fee = currentContent.price * (PLATFORM_FEE_PERCENT / 100);
                creator.earnings += (currentContent.price - fee);
                
                db.transactions.push({
                    id: Date.now(),
                    content: currentContent.title,
                    amount: currentContent.price,
                    fee: fee,
                    date: new Date().toLocaleDateString()
                });
                
                alert('Payment successful! Content unlocked.');
                closeModal();
                loadFeed();
            }, 1500);
        }

        function tipCreator() {
            alert('Tip feature: Opens $1 quick pay');
        }

        // Wallet Functions
        function loadWallet() {
            // Calculate from db
            const total = db.creators.reduce((sum, c) => sum + c.earnings, 0);
            document.getElementById('wallet-balance').textContent = `$${total.toFixed(2)}`;
            
            const txList = document.getElementById('transaction-list');
            if (db.transactions.length > 0) {
                txList.innerHTML = db.transactions.map(tx => `
                    <div class="flex justify-between border-b border-slate-700 pb-2">
                        <div>
                            <p class="text-white">${tx.content}</p>
                            <p class="text-xs text-slate-500">${tx.date}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-emerald-400">+$${(tx.amount - tx.fee).toFixed(2)}</p>
                            <p class="text-xs text-slate-600">Fee: $${tx.fee.toFixed(2)}</p>
                        </div>
                    </div>
                `).join('');
            }
        }

        function requestWithdrawal() {
            const phone = document.getElementById('withdraw-phone').value;
            const amount = parseFloat(document.getElementById('withdraw-amount').value);
            
            if (!phone || !amount || amount < 5) {
                alert('Minimum withdrawal is $5. Enter valid EcoCash number.');
                return;
            }
            
            alert(`Withdrawal request submitted:\n$${amount} to ${phone}\n\nProcessing time: 24 hours`);
        }

        // Creator Functions
        function becomeCreator() {
            const name = prompt("Your creator/artist name:");
            const eco = prompt("Your EcoCash number (077...):");
            if (name && eco) {
                db.creators.push({
                    id: db.creators.length + 1,
                    name: name,
                    bio: "New creator",
                    eco: eco,
                    earnings: 0
                });
                alert('Creator profile created! You can now upload content.');
                showTab('profile');
            }
        }

        function showUploadModal() {
            document.getElementById('modal-upload').classList.remove('hidden');
        }

        function closeUploadModal() {
            document.getElementById('modal-upload').classList.add('hidden');
        }

        function uploadContent() {
            const title = document.getElementById('upload-title').value;
            const price = parseFloat(document.getElementById('upload-price').value);
            const category = document.getElementById('upload-category').value;
            
            if (!title || !price) {
                alert('Fill in all fields');
                return;
            }
            
            // Simulate upload
            db.content.push({
                id: db.content.length + 1,
                creator_id: 1, // Current user
                title: title,
                price: price,
                category: category,
                image: "https://picsum.photos/400/400?random=" + Date.now(),
                unlocked: false
            });
            
            alert('Content published!');
            closeUploadModal();
            loadFeed();
            showTab('feed');
        }

        function loginWithPhone() {
            const phone = prompt("Enter phone number:");
            if (phone) {
                currentUser = { phone };
                document.getElementById('profile-name').textContent = "User " + phone.slice(-4);
                document.getElementById('profile-bio').textContent = "Creator Account";
                document.getElementById('creator-dashboard').classList.remove('hidden');
                document.getElementById('profile-initial').textContent = phone.slice(-2);
            }
        }

        // Initialize
        window.onload = () => {
            initDemo();
            // Register service worker if supported
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            }
        };
    </script>
</body>
</html>
